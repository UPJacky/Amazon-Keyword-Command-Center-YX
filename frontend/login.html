<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="关键词作战总表登录页">
  <title>登录 · 关键词作战总表</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-panel auth-panel--brand">
      <a class="brand brand--light" href="index.html"><span class="brand-mark brand-mark--light">YX</span><span>关键词作战总表</span></a>
      <div class="auth-panel__message">
        <p class="eyebrow eyebrow--light">PRIVATE OPERATIONS DESK</p>
        <h1>让每个关键词，都能说明自己为什么这样判断。</h1>
        <p>登录后访问任务、策略和私有报告。Provider Key、对象存储 Secret 与规则写权限不会进入浏览器。</p>
      </div>
      <div class="auth-note"><span class="status-dot status-dot--mint"></span><span>未备案路线 · HTTPS 托管前端</span></div>
    </section>
    <section class="auth-panel auth-panel--form">
      <div class="auth-form-wrap">
        <a class="back-link" href="index.html">← 返回入口</a>
        <p class="eyebrow">SIGN IN</p>
        <h2>登录工作台</h2>
        <p class="muted">请确认顶部运行模式：Demo 不发送登录请求；Live 使用真实 Auth 验证。</p>
        <form id="login-form" class="form-stack">
          <label for="email">工作邮箱</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="name@company.com" required>
          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="输入密码" required>
          <div class="form-row form-row--between"><label class="checkbox-label"><input type="checkbox" name="remember"> 记住本设备</label><a href="#password-help">忘记密码？</a></div>
          <button class="button button--primary button--full" type="submit">继续</button>
          <p id="login-status" class="form-status" role="status" hidden></p>
        </form>
        <div class="security-callout"><strong>私有报告原则</strong><span>报告与原始报表只通过登录后的受控读取链路访问。</span></div>
      </div>
    </section>
  </main>
  <script src="public-config.js" defer></script><script src="client.js" defer></script><script src="app.js" defer></script>
</body>
</html>
