<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>报告 · 关键词作战总表</title><link rel="stylesheet" href="../styles.css"></head>
<body class="app-shell" data-page="report" data-login-url="../index.html">
  <header class="topbar"><a class="brand" href="../index.html"><span class="brand-mark">YX</span><span>关键词作战总表</span></a><nav aria-label="主导航"><a href="../tool/index.html">工具</a><a class="active" href="index.html">报告</a></nav><button class="user-chip" id="logout" type="button">退出登录</button></header>
  <main class="workspace"><section class="hero-row compact"><div><div class="eyebrow">REPORT / ONLINE FETCH</div><h1>关键词作战总表</h1><p class="lede">报告由 fetch 在线获取并渲染 · <span id="report-period-currency">加载中</span></p></div><button class="button secondary" id="export-report" type="button">导出报告</button></section>
    <section class="report-meta"><div><span>规则版本</span><strong id="report-rule-version">加载中</strong></div><div><span>配置版本</span><strong id="report-config-version">加载中</strong></div><div><span>报告 schema</span><strong id="report-schema-version">加载中</strong></div><div><span>币种</span><strong id="report-currency">加载中</strong></div><div><span>对账</span><strong id="report-reconciliation" class="text-green">加载中</strong></div><div><span>AI 状态</span><strong>未请求</strong></div></section>
    <section class="panel panel--large report-traceability"><div><span>输入文件</span><code id="report-input-file">加载中</code></div><div><span>输入 SHA-256</span><code id="report-input-sha256">加载中</code></div><div><span>Provider snapshot</span><code id="report-provider-version">加载中</code></div><div><span>缺失字段</span><code id="report-missing-fields">加载中</code></div></section>
    <section class="panel table-panel"><div class="panel-head"><div><h2 id="keyword-count">加载中</h2><p id="report-filter-status" class="muted">正在 fetch 报告 artifact</p></div><div class="filters"><button class="filter active" data-action-filter="all">全部</button><button class="filter" data-action-filter="add">加投</button><button class="filter" data-action-filter="defend">防守</button><button class="filter" data-action-filter="keep">保持</button><button class="filter" data-action-filter="cautious">谨慎</button><button class="filter" data-action-filter="optimize">优化</button><button class="filter" data-action-filter="stop_loss">止损/暂停</button><button class="filter" data-action-filter="data_missing">数据待补</button></div></div><div class="table-scroll"><table class="data-table data-table--report"><thead><tr><th>搜索词</th><th>角色 / 阶段</th><th>结论</th><th>展示</th><th>点击</th><th>CTR</th><th>CPC</th><th>花费</th><th>订单</th><th>销售额</th><th>CVR</th><th>ACOS</th><th>ROAS</th><th>证据</th><th>搜索量</th><th>难度</th><th>建议竞价</th><th>自然位</th><th>广告位</th><th>下一步</th><th>缺失字段</th></tr></thead><tbody id="report-rows"><tr><td colspan="21">正在 fetch 报告 artifact…</td></tr></tbody></table></div></section>
  </main><div class="toast" id="toast" role="status"></div><script src="../public-config.js"></script><script src="../client.js"></script><script src="../app.js"></script><script src="../report.js"></script>
</body></html>
